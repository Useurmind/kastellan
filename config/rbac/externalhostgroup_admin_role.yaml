# This rule is not used by the project kastellan itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over kastellan.useurmind.de.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kastellan
    app.kubernetes.io/managed-by: kustomize
  name: externalhostgroup-admin-role
rules:
- apiGroups:
  - kastellan.useurmind.de
  resources:
  - externalhostgroups
  verbs:
  - '*'
- apiGroups:
  - kastellan.useurmind.de
  resources:
  - externalhostgroups/status
  verbs:
  - get
