# This rule is not used by the project kastellan itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the kastellan.useurmind.de.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kastellan
    app.kubernetes.io/managed-by: kustomize
  name: externalhostgroup-editor-role
rules:
- apiGroups:
  - kastellan.useurmind.de
  resources:
  - externalhostgroups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kastellan.useurmind.de
  resources:
  - externalhostgroups/status
  verbs:
  - get
